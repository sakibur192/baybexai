<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BaybexAI Admin</title>
<link rel="icon" href="/assets/favicon.png">

<style>
@font-face{font-family:'Plus Jakarta Sans';font-weight:400;font-display:swap;src:url(/assets/fonts/plus-jakarta-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Plus Jakarta Sans';font-weight:600;font-display:swap;src:url(/assets/fonts/plus-jakarta-sans-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Plus Jakarta Sans';font-weight:700;font-display:swap;src:url(/assets/fonts/plus-jakarta-sans-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Plus Jakarta Sans';font-weight:800;font-display:swap;src:url(/assets/fonts/plus-jakarta-sans-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Hind Siliguri';font-weight:400;font-display:swap;src:url(/assets/fonts/hind-siliguri-bengali-400-normal.woff2) format('woff2');unicode-range:U+0980-09FE,U+200C-200D,U+25CC}
@font-face{font-family:'Hind Siliguri';font-weight:600;font-display:swap;src:url(/assets/fonts/hind-siliguri-bengali-600-normal.woff2) format('woff2');unicode-range:U+0980-09FE,U+200C-200D,U+25CC}
@font-face{font-family:'Hind Siliguri';font-weight:700;font-display:swap;src:url(/assets/fonts/hind-siliguri-bengali-700-normal.woff2) format('woff2');unicode-range:U+0980-09FE,U+200C-200D,U+25CC}
:root{--p:#124874;--a:#008390;--ink:#0f172a;--mut:#64748b;--line:#e5e9f0;--bg:#f3f6fa;--red:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans','Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px}
html[lang=bn] body{font-family:'Hind Siliguri','Plus Jakarta Sans',system-ui,sans-serif}
a{color:inherit}
button{font:inherit;cursor:pointer}
.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(150deg,var(--p),#12466F);padding:20px}
.login form{background:#fff;border-radius:20px;padding:36px;width:100%;max-width:380px;display:grid;gap:16px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
.login h1{display:flex;align-items:center;gap:10px;color:var(--p);font-size:22px}
.login h1 img{width:40px}
.layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--p);color:#cbd5e1;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
aside .brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:18px;padding:6px 10px 20px}
aside .brand img{width:34px}
aside nav{display:grid;gap:2px}
aside nav button{display:flex;gap:10px;align-items:center;background:none;border:0;color:inherit;padding:10px 12px;border-radius:10px;text-align:left;font-weight:600}
aside nav button:hover{background:rgba(255,255,255,.07);color:#fff}
aside nav button.on{background:var(--a);color:#fff}
aside nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;opacity:.5;padding:14px 12px 4px}
aside .nb{margin-left:auto;background:#ef4444;color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}
main{padding:24px 28px;min-width:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.top h2{font-size:22px;color:var(--p);margin-right:auto}
.burger{display:none;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:18px}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside{position:fixed;z-index:40;left:0;width:250px;transform:translateX(-100%);transition:.2s}aside.open{transform:none}.burger{display:block}main{padding:16px}}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;color:var(--p);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--a)}
.btn.pr{background:var(--a);border-color:var(--a);color:#fff}
.btn.dk{background:var(--p);border-color:var(--p);color:#fff}
.btn.dn{color:var(--red)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}
.panel h3{color:var(--p);font-size:16px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
.kpi b{font-size:28px;color:var(--p);display:block}
.kpi span{color:var(--mut);font-weight:600;font-size:13px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut)}
tr:hover td{background:#fafbfd}
.tbl{overflow:auto}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#eef2f7;color:#334155}
.chip.new{background:#fef3c7;color:#92400e}.chip.contacted{background:#dbeafe;color:#1e40af}.chip.demo{background:#ede9fe;color:#5b21b6}.chip.won{background:#dcfce7;color:#166534}.chip.lost{background:#fee2e2;color:#991b1b}
.chip.off{background:#f1f5f9;color:#94a3b8}
.mut{color:var(--mut)}
label.f,div.f{display:grid;gap:6px;font-weight:600;font-size:13px;color:#334155}
input,select,textarea{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fbfcfe;width:100%;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--a);background:#fff}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--a)}
input[type=color]{padding:2px;height:42px;width:70px}
textarea{min-height:80px;resize:vertical}
.fg{display:grid;gap:16px}
.bi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bi>div{display:grid;gap:4px}
.bi small{font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.5px}
.cnt{font-weight:600!important;letter-spacing:0!important}
.serp{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff;display:grid;gap:2px;font-family:Arial,sans-serif}.serp span{font-weight:400}.serp .u{color:#202124;font-size:13px}.serp .t{color:#1a0dab;font-size:19px;line-height:1.3}.serp .d{color:#4d5156;font-size:14px;line-height:1.5}
.bar{display:flex;align-items:center;gap:8px}.bar i{display:block;height:8px;border-radius:4px;background:var(--a);min-width:2px}
.agrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}.delta{font-size:12.5px;font-weight:700}.up{color:#059669}.down{color:#dc2626}
@media(max-width:700px){.bi{grid-template-columns:1fr}}
.img{display:flex;gap:10px;align-items:center}
.img .pv{width:64px;height:64px;border-radius:10px;border:1px solid var(--line);object-fit:contain;background:#f8fafc;flex:none}
.gal{display:flex;flex-wrap:wrap;gap:8px}
.gal div{position:relative}
.gal img{width:90px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.gal button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:12px;line-height:1}
.chk{display:flex;gap:10px;align-items:center;font-weight:600}
.drawer{position:fixed;inset:0;background:rgba(2,8,23,.5);z-index:60;display:none;justify-content:flex-end}
.drawer.open{display:flex}
.drawer .in{background:#fff;width:min(780px,100%);height:100%;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:18px}
.drawer .hd{display:flex;align-items:center;gap:10px}
.drawer .hd h3{margin-right:auto;color:var(--p)}
.drawer .ft{position:sticky;bottom:-24px;background:#fff;padding:14px 0;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;margin-top:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:700;color:#334155}
.tabs button.on{background:var(--p);color:#fff;border-color:var(--p)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--p);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;z-index:99;display:none;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.toast.err{background:var(--red)}
.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:12px 16px;border-radius:12px;margin-bottom:16px;font-weight:600}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.media .it{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.media img{width:100%;height:110px;object-fit:contain;background:#f8fafc;cursor:pointer}
.media .it div{padding:8px;display:flex;gap:6px;justify-content:space-between;font-size:12px}
.leadx{background:#f8fafc;border-radius:10px;padding:12px;margin-top:8px;display:grid;gap:8px}
.rep{display:grid;gap:10px}
.rep .row{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;position:relative}
.rep .row .x{position:absolute;top:8px;right:8px}
.lsw{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:#fff}
.lsw button{border:0;background:none;padding:5px 11px;border-radius:999px;font-weight:700;font-size:12.5px;color:var(--mut)}
.lsw button.on{background:var(--p);color:#fff}
.picker{position:fixed;inset:0;background:rgba(2,8,23,.55);z-index:80;display:grid;place-items:center;padding:20px}
.picker .in{background:#fff;border-radius:16px;padding:20px;width:min(900px,100%);max-height:85vh;overflow:auto}
</style>
</head>

/* ================= Field rendering ================= */
function F(f, v, id){
  const lab = T(f.label);
  const n = `data-k="${f.k}"`;
  if(f.type==='bool') return `<label class="chk"><input type="checkbox" ${n} data-t="bool" ${(v===undefined?f.def:v)?'checked':''}> ${esc(lab)}</label>`;
  let inner='';
  switch(f.type){
    case 'text': inner=`<input ${n} data-t="text" value="${esc(v)}" placeholder="${esc(f.ph||'')}">`; break;
    case 'number': inner=`<input type="number" ${n} data-t="number" value="${esc(v===undefined?f.def:v)}">`; break;
    case 'color': inner=`<div style="display:flex;gap:10px"><input type="color" ${n} data-t="text" value="${esc(v||'#000000')}" oninput="this.nextElementSibling.value=this.value"><input value="${esc(v||'')}" oninput="this.previousElementSibling.value=this.value" style="max-width:140px"></div>`; break;
    case 'textarea': inner=`<textarea ${n} data-t="text" rows="${f.rows||4}" style="font-family:monospace;font-size:13px">${esc(v)}</textarea>`; break;
    case 'select': inner=`<select ${n} data-t="text">${f.opts().map(([a,b])=>`<option value="${esc(a)}" ${a===v?'selected':''}>${esc(b)}</option>`).join('')}</select>`; break;
    case 'bi': { const mx=f.max?` data-max="${f.max}"`:''; const ct=f.max?'<small class="cnt"></small>':''; inner=`<div class="bi" ${n} data-t="bi"><div><small>ENGLISH</small><input data-l="en"${mx} value="${esc(v&&v.en)}">${ct}</div><div><small>বাংলা</small><input data-l="bn"${mx} value="${esc(v&&v.bn)}">${ct}</div></div>`; break; }
    case 'bitext': case 'bimd': { const mx=f.max?` data-max="${f.max}"`:''; const ct=f.max?'<small class="cnt"></small>':''; const mono=f.type==='bimd'?' style="font-size:13.5px;line-height:1.5"':''; inner=`<div class="bi" ${n} data-t="bi"><div><small>ENGLISH</small><textarea data-l="en"${mx}${mono} rows="${f.rows||3}">${esc(v&&v.en)}</textarea>${ct}</div><div><small>বাংলা</small><textarea data-l="bn"${mx}${mono} rows="${f.rows||3}">${esc(v&&v.bn)}</textarea>${ct}</div></div>${f.type==='bimd'?`<small class="mut">${esc(T('md_hint'))}</small>`:''}`; break; }
    case 'date': inner=`<input type="date" ${n} data-t="text" value="${esc(v||new Date().toISOString().slice(0,10))}">`; break;
    case 'bilist': { const a=Array.isArray(v)?v:[]; inner=`<div class="bi" ${n} data-t="bilist"><div><small>ENGLISH</small><textarea data-l="en" rows="7">${esc(a.map(x=>x.en||'').join('\n'))}</textarea></div><div><small>বাংলা</small><textarea data-l="bn" rows="7">${esc(a.map(x=>x.bn||'').join('\n'))}</textarea></div></div><small class="mut">${T('features_hint')}</small>`; break; }
    case 'image': inner=`<div class="img" ${n} data-t="image"><img class="pv" src="${esc(v||'/assets/favicon.png')}" style="${v?'':'opacity:.25'}"><input value="${esc(v)}" placeholder="/uploads/… or https://" oninput="this.previousElementSibling.src=this.value||'/assets/favicon.png'"><label class="btn sm">${T('upload')}<input type="file" accept="image/*" hidden data-up></label><button type="button" class="btn sm" data-pick>${T('choose')}</button><button type="button" class="btn sm dn" data-clr>✕</button></div>`; break;
    case 'gallery': inner=`<div ${n} data-t="gallery"><div class="gal">${(v||[]).map(g=>`<div data-u="${esc(g)}"><img src="${esc(g)}"><button type="button" data-rm>×</button></div>`).join('')}</div><div style="margin-top:8px;display:flex;gap:8px"><label class="btn sm">${T('upload')}<input type="file" accept="image/*" multiple hidden data-upg></label><button type="button" class="btn sm" data-pickg>${T('choose')}</button></div></div>`; break;
    case 'sections': inner=`<div ${n} data-t="sections" style="display:grid;gap:10px">${SECTION_KEYS.map(s=>`<label class="chk"><input type="checkbox" data-s="${s}" ${!v||v[s]!==false?'checked':''}> ${esc(T(s==='faq'?'faqs':s==='contact'?'Contact':s==='about'?'g_about':s==='blog'?'posts':s))}</label>`).join('')}</div>`; break;
    case 'repeater': inner=`<div ${n} data-t="repeater" class="rep">${(v||[]).map(r=>repRow(f,r)).join('')}</div><button type="button" class="btn sm" data-addrow style="justify-self:start">+ ${T('add_row')}</button>`; break;
  }
  return `<div class="f"><span>${esc(lab)}</span>${inner}</div>`;
}
function repRow(f,r){ return `<div class="row"><button type="button" class="btn sm dn x" data-rmrow>✕</button>${f.sub.map(s=>F(s,r&&r[s.k])).join('')}</div>`; }
function readField(el){
  const t=el.dataset.t;
  if(t==='bool') return el.checked;
  if(t==='number') return Number(el.value)||0;
  if(t==='text') return el.value.trim();
  if(t==='bi') return {en:$('[data-l=en]',el).value.trim(),bn:$('[data-l=bn]',el).value.trim()};
  if(t==='bilist'){ const en=$('[data-l=en]',el).value.split('\n'),bn=$('[data-l=bn]',el).value.split('\n'); const n=Math.max(en.length,bn.length),o=[]; for(let i=0;i<n;i++){const a=(en[i]||'').trim(),b=(bn[i]||'').trim(); if(a||b)o.push({en:a,bn:b});} return o; }
  if(t==='image') return $('input:not([type=file])',el).value.trim();
  if(t==='gallery') return $$('.gal>div',el).map(d=>d.dataset.u);
  if(t==='sections'){ const o={}; $$('[data-s]',el).forEach(c=>o[c.dataset.s]=c.checked); return o; }
  if(t==='repeater') return $$(':scope>.row',el).map(row=>{ const o={}; $$('[data-k]',row).forEach(x=>o[x.dataset.k]=readField(x)); return o; });
}
function readForm(root){ const o={}; $$('[data-k]',root).forEach(el=>{ if(el.closest('[data-t=repeater]') && el.closest('[data-t=repeater]')!==el) return; o[el.dataset.k]=readField(el); }); return o; }
async function uploadFile(file){ const fd=new FormData(); fd.append('file',file); const r=await api('/upload',{method:'POST',body:fd}); return r.url; }
function updCount(el){ const c=el.nextElementSibling; if(!c||!c.classList.contains('cnt'))return; const n=el.value.length,m=+el.dataset.max; c.textContent=n+' / '+m+' '+T('chars'); c.style.color=n>m?'#dc2626':n>m*0.5?'#059669':'#94a3b8'; }
function wireFields(root, schemaFields){
  $$('[data-max]',root).forEach(updCount);
  root.addEventListener('input', e=>{ if(e.target.dataset&&e.target.dataset.max) updCount(e.target); });
  root.addEventListener('change', async e=>{
    if(e.target.matches('[data-up]')){ const box=e.target.closest('[data-t=image]'); const f=e.target.files[0]; if(!f)return; const url=await uploadFile(f); setImg(box,url); toast(T('saved')); }
    if(e.target.matches('[data-upg]')){ const box=e.target.closest('[data-t=gallery]'); for(const f of e.target.files){ const url=await uploadFile(f); addGal(box,url);} }
  });
  root.addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b) return;
    if(b.matches('[data-clr]')) setImg(b.closest('[data-t=image]'),'');
    if(b.matches('[data-pick]')) pickMedia(u=>setImg(b.closest('[data-t=image]'),u));
    if(b.matches('[data-pickg]')) pickMedia(u=>addGal(b.closest('[data-t=gallery]'),u));
    if(b.matches('[data-rm]')) b.parentElement.remove();
    if(b.matches('[data-rmrow]')) b.closest('.row').remove();
    if(b.matches('[data-addrow]')){ const rep=b.parentElement.querySelector(':scope > [data-t=repeater]'); const f=(schemaFields||[]).find(x=>x.k===rep.dataset.k); rep.insertAdjacentHTML('beforeend',repRow(f,{})); }
  });
}
function setImg(box,u){ $('input:not([type=file])',box).value=u; const p=$('.pv',box); p.src=u||'/assets/favicon.png'; p.style.opacity=u?1:.25; }
function addGal(box,u){ $('.gal',box).insertAdjacentHTML('beforeend',`<div data-u="${esc(u)}"><img src="${esc(u)}"><button type="button" data-rm>×</button></div>`); }
async function pickMedia(cb){
  const files=await api('/uploads');
  const d=document.createElement('div'); d.className='picker';
  d.innerHTML=`<div class="in"><div class="top"><h2>${T('media')}</h2><button class="btn" data-x>✕</button></div>${files.length?`<div class="media">${files.map(f=>`<div class="it"><img src="${esc(f.url)}" data-u="${esc(f.url)}"></div>`).join('')}</div>`:`<p class="mut">${T('none')}</p>`}</div>`;
  document.body.appendChild(d);
  d.onclick=e=>{ if(e.target===d||e.target.closest('[data-x]')) d.remove(); const u=e.target.dataset.u; if(u){ cb(u); d.remove(); } };
}

const pubPath=(name,x)=>!x?null:name==='solutions'?'/solutions/'+x.slug:name==='posts'?'/blog/'+x.slug:name==='pages'?'/'+x.slug:name==='categories'?'/category/'+x.id:null;

function updSerp(name,root,item){
  const v=readForm(root); const site=DB.settings.siteName||'BaybexAI'; const def=DB.defLang||'bn';
  const nm=(l)=>(v.name&&v.name[l])||(v.title&&v.title[l])||'';
  const ds=(l)=>(v.seoDescription&&v.seoDescription[l])||(v.short&&v.short[l])||(v.excerpt&&v.excerpt[l])||(v.intro&&v.intro[l])||(v.description&&v.description[l])||'';
  const slug=v.slug||(item&&item.slug)||'…';
  const p=name==='solutions'?'/solutions/'+slug:name==='posts'?'/blog/'+slug:name==='categories'?'/category/'+((item&&item.id)||v.id||'…'):'/'+slug;
  $$('[data-serp]',root).forEach(b=>{ const l=b.dataset.serp; const t=(v.seoTitle&&v.seoTitle[l])||(nm(l)+' | '+site); let d=ds(l).replace(/[#*>\[\]()`]/g,'').replace(/\s+/g,' ').trim(); if(d.length>158)d=d.slice(0,157)+'…';
    b.innerHTML=`<span class="u">${esc((DB.siteUrl||'')+(l===def?'':'/'+l)+p)}</span><span class="t">${esc(t.length>62?t.slice(0,61)+'…':t)}</span><span class="d">${esc(d)}</span>`; });
}
function openEditor(name,item){
  const sc=SCHEMA[name], d=$('#drawer'), din=$('#din');

  din.innerHTML=`<div class="hd"><h3>${item?T('edit'):T('add')} — ${T(name)}</h3><button class="btn" data-x>✕</button></div>
    <form class="fg" id="ef">${fields.map(f=>F(f,item?item[f.k]:undefined)).join('')}${fields.some(f=>f.k==='seoTitle')?serpBox():''}
    <div class="ft"><button type="button" class="btn" data-x>${T('cancel')}</button><button class="btn pr">${T('save')}</button></div></form>`;

function vBackup(){
  $('#view').innerHTML=`<div class="panel"><h3>${T('backup_dl')}</h3><p class="mut" style="margin-bottom:12px">data/db.json — settings, solutions, leads…</p><a class="btn pr" href="/api/admin/backup">⬇ ${T('backup_dl')}</a></div>
    <div class="panel"><h3>${T('restore')}</h3><label class="btn">⬆ ${T('restore')}<input type="file" accept=".json,application/json" hidden id="rf"></label></div>`;
  $('#rf').onchange=async e=>{ const f=e.target.files[0]; if(!f||!confirm(T('restore_warn')))return;
    try{ const body=JSON.parse(await f.text()); await api('/restore',{method:'POST',body}); await load(); toast(T('restored')); shell(); }catch(err){ if(err instanceof SyntaxError) toast('Invalid JSON',true); } };
}

/* ================= Boot ================= */
(async()=>{ try{ me=await api('/me'); await load(); if(me.mustChange) view='users'; shell(); }catch(e){ if(!me) renderLogin(); } })();
})();
</script>
</body>
