<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="{{URL}}/">
<link rel="alternate" hreflang="en" href="{{URL}}/?lang=en">
<link rel="alternate" hreflang="bn" href="{{URL}}/?lang=bn">
<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta property="og:url" content="{{URL}}/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="{{PRIMARY}}">
<link rel="icon" href="{{FAVICON}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script type="application/ld+json">{{JSONLD}}</script>
<style>
:root{--p:{{PRIMARY}};--a:{{ACCENT}};--ink:#0f172a;--mut:#5b6b80;--line:#e5eaf1;--bg:#f6f8fb;--card:#fff;--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans','Hind Siliguri',system-ui,sans-serif;color:var(--ink);background:#fff;line-height:1.6;-webkit-font-smoothing:antialiased}
html[lang=bn] body{font-family:'Hind Siliguri','Plus Jakarta Sans',system-ui,sans-serif;line-height:1.7}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:999px;font-weight:700;transition:.2s;white-space:nowrap}
.btn-a{background:var(--a);color:#fff;box-shadow:0 8px 24px -8px var(--a)}
.btn-a:hover{transform:translateY(-2px);filter:brightness(1.05)}
.btn-o{border:1.5px solid rgba(255,255,255,.35);color:#fff}
.btn-o:hover{background:rgba(255,255,255,.1)}
.btn-p{background:var(--p);color:#fff}
.btn-l{border:1.5px solid var(--line);color:var(--p);background:#fff}
.btn-l:hover{border-color:var(--a);color:var(--a)}
.ann{background:var(--a);color:#fff;text-align:center;font-size:14px;padding:8px 16px;font-weight:600}
/* nav */
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:24px;height:72px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;color:var(--p)}
.brand img{height:42px;width:auto}
.brand .mk{height:40px;width:40px}
.links{display:flex;gap:26px;margin-left:auto;font-weight:600;font-size:15px;color:#334155}
.links a:hover{color:var(--a)}
.langsw{display:flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;font-size:13px;font-weight:700}
.langsw button{padding:6px 12px;border-radius:999px;color:var(--mut)}
.langsw button.on{background:var(--p);color:#fff}
.burger{display:none;font-size:26px;color:var(--p)}
@media(max-width:900px){.links{display:none;position:absolute;top:72px;left:0;right:0;background:#fff;flex-direction:column;padding:16px 20px;gap:14px;border-bottom:1px solid var(--line)}.links.open{display:flex}.burger{display:block}.nav .btn-a{display:none}.langsw{margin-left:auto}}
/* hero */
.hero{background:radial-gradient(1000px 500px at 85% -10%,color-mix(in srgb,var(--a) 35%,transparent),transparent 60%),linear-gradient(160deg,var(--p),color-mix(in srgb,var(--p) 80%,#000));color:#fff;padding:90px 0 110px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(180deg,#000,transparent);pointer-events:none}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
.pill{display:inline-block;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);font-size:13px;font-weight:600;letter-spacing:.3px;margin-bottom:22px}
.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.12;font-weight:800;letter-spacing:-1px;margin-bottom:20px}
html[lang=bn] .hero h1{letter-spacing:0;line-height:1.3}
.hero p.sub{font-size:18px;opacity:.85;max-width:560px;margin-bottom:32px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.hero-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:24px;padding:22px;backdrop-filter:blur(6px)}
.hero-card img{border-radius:16px}
.hc-list{display:grid;gap:10px}
.hc-item{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border-radius:14px;padding:12px 14px;font-weight:600}
.hc-item span.i{font-size:22px;width:40px;height:40px;display:grid;place-items:center;background:rgba(255,255,255,.12);border-radius:12px}
.hc-item small{display:block;opacity:.7;font-weight:500;font-size:12.5px}
@media(max-width:900px){.hero .wrap{grid-template-columns:1fr}.hero{padding:60px 0 90px}}
.stats{margin-top:-56px;position:relative;z-index:2}
.stats .grid{background:#fff;border-radius:22px;box-shadow:0 20px 50px -20px rgba(15,23,42,.25);display:grid;grid-template-columns:repeat(4,1fr);padding:26px 10px}
.stat{text-align:center;padding:6px 12px;border-right:1px solid var(--line)}
.stat:last-child{border:0}
.stat b{display:block;font-size:30px;color:var(--p);font-weight:800}
.stat span{color:var(--mut);font-size:14px}
@media(max-width:700px){.stats .grid{grid-template-columns:repeat(2,1fr);row-gap:18px}.stat:nth-child(2){border:0}}
/* sections */
section.s{padding:90px 0}
section.alt{background:var(--bg)}
.sh{text-align:center;max-width:700px;margin:0 auto 46px}
.sh .k{color:var(--a);font-weight:700;font-size:14px;letter-spacing:1.5px;text-transform:uppercase}
.sh h2{font-size:clamp(28px,3.6vw,40px);font-weight:800;color:var(--p);margin:8px 0 10px;line-height:1.25}
.sh p{color:var(--mut);font-size:17px}
.tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:36px}
.tab{padding:10px 18px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:14.5px;color:#334155}
.tab.on{background:var(--p);border-color:var(--p);color:#fff}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
@media(max-width:980px){.grid3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.grid3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px;transition:.25s;display:flex;flex-direction:column;position:relative}
.card:hover{transform:translateY(-4px);box-shadow:0 24px 50px -24px rgba(15,23,42,.3);border-color:color-mix(in srgb,var(--a) 40%,var(--line))}
.card .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:color-mix(in srgb,var(--a) 12%,#fff);margin-bottom:18px}
.card .thumb{margin:-26px -26px 18px;border-radius:var(--r) var(--r) 0 0;aspect-ratio:16/9;object-fit:cover;width:calc(100% + 52px);max-width:none}
.card h3{font-size:20px;color:var(--p);margin-bottom:6px;line-height:1.35}
.card p{color:var(--mut);font-size:15px}
.card ul{list-style:none;margin:16px 0;display:grid;gap:7px}
.card li{font-size:14.5px;display:flex;gap:8px;color:#334155}
.card li:before{content:"✓";color:var(--a);font-weight:800}
.card .foot{margin-top:auto;padding-top:16px;border-top:1px dashed var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.price{font-weight:700;color:var(--p);font-size:14.5px}
.badge{position:absolute;top:18px;right:18px;background:color-mix(in srgb,var(--a) 15%,#fff);color:color-mix(in srgb,var(--a) 70%,#000);font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px}
.badge.f{background:var(--p);color:#fff}
.lnk{color:var(--a);font-weight:700;font-size:14.5px}
.hl{display:flex;gap:16px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px}
.hl .ic{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--p) 8%,#fff)}
.hl h3{font-size:18px;color:var(--p);margin-bottom:4px}
.hl p{color:var(--mut);font-size:15px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px;counter-reset:st}
.step{background:#fff;border-radius:var(--r);padding:26px 22px;border:1px solid var(--line);counter-increment:st;position:relative}
.step:before{content:counter(st);width:40px;height:40px;border-radius:12px;background:var(--a);color:#fff;font-weight:800;display:grid;place-items:center;margin-bottom:14px}
html[lang=bn] .step:before{content:counter(st,bengali)}
.step h3{font-size:17px;color:var(--p);margin-bottom:4px}
.step p{font-size:14.5px;color:var(--mut)}
.about{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center}
.about .txt p{color:#334155;font-size:17px;white-space:pre-line}
.about .box{background:linear-gradient(150deg,var(--p),color-mix(in srgb,var(--p) 70%,var(--a)));border-radius:24px;padding:36px;color:#fff;display:grid;gap:16px}
.about .box div{display:flex;gap:12px;align-items:center;font-weight:600}
.about .box div span{font-size:22px}
@media(max-width:860px){.about{grid-template-columns:1fr}}
.pf{border-radius:var(--r);overflow:hidden;background:#fff;border:1px solid var(--line)}
.pf img{aspect-ratio:16/10;object-fit:cover;width:100%}
.pf div{padding:18px}
.pf h3{color:var(--p);font-size:17px}
.pf p{color:var(--mut);font-size:14.5px}
.tm{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px}
.tm .st{color:#f59e0b;letter-spacing:2px;margin-bottom:10px}
.tm p{color:#334155;margin-bottom:18px}
.tm .who{display:flex;gap:12px;align-items:center}
.tm .who img,.tm .who .av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--bg);display:grid;place-items:center;font-weight:800;color:var(--p)}
.tm .who b{display:block;color:var(--p)}
.tm .who small{color:var(--mut)}
.faq{max-width:820px;margin:0 auto;display:grid;gap:12px}
.faq details{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 22px}
.faq summary{font-weight:700;color:var(--p);cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary:after{content:"+";font-size:22px;line-height:1;color:var(--a)}
.faq details[open] summary:after{content:"−"}
.faq details p{margin-top:10px;color:var(--mut);white-space:pre-line}
/* contact */
.contact{display:grid;grid-template-columns:.9fr 1.1fr;gap:30px}
.cinfo{background:var(--p);color:#fff;border-radius:24px;padding:36px;display:grid;gap:20px;align-content:start}
.cinfo h3{font-size:24px}
.cinfo .row{display:flex;gap:14px;align-items:flex-start}
.cinfo .row span{width:44px;height:44px;flex:none;border-radius:12px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:20px}
.cinfo .row small{display:block;opacity:.7;font-size:13px}
.cinfo .row a,.cinfo .row b{font-weight:700;word-break:break-word}
form.f{background:#fff;border:1px solid var(--line);border-radius:24px;padding:32px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
form.f .full{grid-column:1/-1}
label{font-size:14px;font-weight:600;color:#334155;display:grid;gap:6px}
input,select,textarea{font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fbfcfe;width:100%;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--a);background:#fff}
textarea{min-height:110px;resize:vertical}
.hp{position:absolute;left:-9999px}
.msg{padding:12px 14px;border-radius:12px;font-weight:600;font-size:14.5px}
.msg.ok{background:#e7f8f3;color:#0f766e}.msg.err{background:#fdecec;color:#b42318}
@media(max-width:860px){.contact{grid-template-columns:1fr}form.f{grid-template-columns:1fr;padding:22px}}
/* footer */
footer{background:color-mix(in srgb,var(--p) 92%,#000);color:#cbd5e1;padding:60px 0 26px;font-size:15px}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:30px}
footer h4{color:#fff;margin-bottom:14px;font-size:16px}
footer ul{list-style:none;display:grid;gap:8px}
footer a:hover{color:var(--a)}
footer .brand{color:#fff;margin-bottom:12px}
.soc{display:flex;gap:10px;margin-top:14px}
.soc a{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-weight:800;font-size:14px}
.copy{border-top:1px solid rgba(255,255,255,.1);margin-top:40px;padding-top:20px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;opacity:.8}
@media(max-width:860px){.fgrid{grid-template-columns:1fr 1fr}}
/* modal */
.modal{position:fixed;inset:0;background:rgba(2,8,23,.6);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal.open{display:flex}
.mbox{background:#fff;border-radius:24px;max-width:820px;width:100%;position:relative;overflow:hidden;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(16px)}}
.mhead{background:linear-gradient(150deg,var(--p),color-mix(in srgb,var(--p) 75%,var(--a)));color:#fff;padding:32px}
.mhead .ic{font-size:34px;width:64px;height:64px;border-radius:18px;background:rgba(255,255,255,.12);display:grid;place-items:center;margin-bottom:14px}
.mhead h2{font-size:28px;line-height:1.3}
.mhead p{opacity:.85}
.mbody{padding:30px 32px;display:grid;gap:24px}
.mbody .desc{color:#334155;white-space:pre-line}
.mbody h4{color:var(--p);margin-bottom:10px}
.feats{display:grid;grid-template-columns:1fr 1fr;gap:10px;list-style:none}
.feats li{background:var(--bg);border-radius:12px;padding:10px 14px;font-size:14.5px;display:flex;gap:8px}
.feats li:before{content:"✓";color:var(--a);font-weight:800}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.gal img{border-radius:12px;aspect-ratio:16/10;object-fit:cover;width:100%}
.mclose{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:22px;z-index:2}
@media(max-width:600px){.feats{grid-template-columns:1fr}.mbody,.mhead{padding:22px}}
.wa{position:fixed;right:20px;bottom:20px;z-index:60;width:58px;height:58px;border-radius:50%;background:#25D366;display:grid;place-items:center;box-shadow:0 10px 30px -8px rgba(0,0,0,.4)}
.wa svg{width:30px;height:30px;fill:#fff}
.empty{text-align:center;color:var(--mut);padding:30px}
.reveal{opacity:0;transform:translateY(18px);transition:.6s ease}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
</style>
{{HEAD_SCRIPTS}}

function solCard(s){
  const feats = (s.features||[]).slice(0,4).map(f=>`<li>${esc(t(f))}</li>`).join('');

function leadForm(type, solution){
  return `<form class="f" data-type="${type}" novalidate>
    <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <label>${u('f_name')} *<input name="name" required maxlength="120" autocomplete="name"></label>
    <label>${u('f_phone')} *<input name="phone" required maxlength="20" inputmode="tel" autocomplete="tel" placeholder="01XXXXXXXXX"></label>
    <label>${u('f_email')}<input name="email" type="email" maxlength="160" autocomplete="email"></label>
    <label>${u('f_company')}<input name="company" maxlength="160" autocomplete="organization"></label>
    <label class="full">${u('f_solution')}<select name="solution"><option value="">${u('f_any')}</option>${D.solutions.map(s=>`<option ${t(s.name)===solution?'selected':''}>${esc(t(s.name))}</option>`).join('')}</select></label>
    <label class="full">${u('f_msg')}<textarea name="message" maxlength="3000"></textarea></label>
    <div class="full fmsg"></div>
    <button class="btn btn-a full" type="submit" style="justify-content:center">${u('f_send')}</button>
  </form>`;
}

function bindForms(root){
  root.querySelectorAll('form.f').forEach(f=>f.onsubmit=async e=>{
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(f)); fd.type=f.dataset.type; fd.lang=lang;
    const m = f.querySelector('.fmsg'), b = f.querySelector('button[type=submit]');
    // convert Bangla digits in phone to English
    fd.phone = String(fd.phone||'').replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d));
    if(!fd.name.trim() || !/^[+0-9\s-]{6,20}$/.test(fd.phone.trim())){ m.innerHTML=`<div class="msg err">${u('err')}</div>`; return; }
    b.disabled=true; b.textContent=u('f_sending');
    try{
      const r = await fetch('/api/lead',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(fd)});
      if(r.ok){ f.reset(); m.innerHTML=`<div class="msg ok">${u('ok')}</div>`; }
      else m.innerHTML=`<div class="msg err">${r.status===429?u('err_many'):u('err')}</div>`;
    }catch(_){ m.innerHTML=`<div class="msg err">${u('err_net')}</div>`; }
    b.disabled=false; b.textContent=u('f_send');
  });
}

function bind(){
  document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
  document.querySelectorAll('.tab[data-cat], footer [data-cat]').forEach(b=>b.addEventListener('click',()=>{
    cat=b.dataset.cat;
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.cat===cat));
    const g=document.getElementById('solgrid'); if(g){g.innerHTML=solutionsGrid(); bindOpen(g); observe();}
  }));
  const bg=document.getElementById('burger'), ln=document.getElementById('links');
  if(bg) bg.onclick=()=>ln.classList.toggle('open');
  ln && ln.querySelectorAll('a').forEach(a=>a.onclick=()=>ln.classList.remove('open'));
  bindOpen(document); bindForms(document);
}
function bindOpen(root){ root.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openSol(b.dataset.open,true)); }

function setLang(l){
  lang=l; try{localStorage.setItem('bx_lang',l)}catch(e){}
  const q=new URLSearchParams(location.search); q.set('lang',l);
  history.replaceState(history.state,'',location.pathname+'?'+q.toString()+location.hash);
  const openSlug = modal.classList.contains('open') ? modal.dataset.slug : null;
  render(); if(openSlug) openSol(openSlug,false);
}

const modal=document.getElementById('modal'), mbox=document.getElementById('mbox');
function openSol(slug, push){
  const s=D.solutions.find(x=>x.slug===slug); if(!s) return;
  modal.dataset.slug=slug;
  const feats=(s.features||[]).map(f=>`<li>${esc(t(f))}</li>`).join('');
  const gal=(s.gallery||[]).filter(url).map(g=>`<a href="${url(g)}" target="_blank" rel="noopener"><img src="${url(g)}" alt="" loading="lazy"></a>`).join('');
  mbox.innerHTML=`<button class="mclose" aria-label="Close">×</button>
    <div class="mhead">${s.image?`<img src="${url(s.image)}" alt="" style="border-radius:16px;margin-bottom:18px;max-height:300px;width:100%;object-fit:cover">`:`<div class="ic">${esc(s.icon)}</div>`}
      <small style="opacity:.75;font-weight:600">${esc(catName(s.category))}</small><h2>${esc(t(s.name))}</h2><p>${esc(t(s.short))}</p></div>
    <div class="mbody">
      <div class="desc">${esc(t(s.description))}</div>
      ${feats?`<div><h4>${u('features')}</h4><ul class="feats">${feats}</ul></div>`:''}
      ${gal?`<div><h4>${u('gallery')}</h4><div class="gal">${gal}</div></div>`:''}
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center"><span class="price" style="font-size:17px">${esc(t(s.price))}</span>
        ${url(s.demoUrl)?`<a class="btn btn-l" href="${url(s.demoUrl)}" target="_blank" rel="noopener">${u('live_demo')} ↗</a>`:''}
        ${S.whatsapp?`<a class="btn btn-l" href="${waHref()}?text=${encodeURIComponent(t(s.name))}" target="_blank" rel="noopener">💬 WhatsApp</a>`:''}</div>
      <div><h4>${u('demo_h')}</h4>${leadForm('demo',t(s.name))}</div>
    </div>`;
  modal.classList.add('open'); document.body.style.overflow='hidden';
  mbox.querySelector('.mclose').onclick=closeSol; bindForms(mbox);
  if(push) history.pushState({slug},'','/solution/'+encodeURIComponent(slug)+'?lang='+lang);
  document.title = t(s.name)+' — '+S.siteName;
}
function closeSol(){
  if(!modal.classList.contains('open')) return;
  modal.classList.remove('open'); document.body.style.overflow='';
  if(location.pathname.startsWith('/solution/')) history.pushState({},'','/?lang='+lang+'#solutions');
  document.title = t(S.seoTitle)||S.siteName;
}
modal.addEventListener('click',e=>{ if(e.target===modal) closeSol(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSol(); });
window.addEventListener('popstate',()=>{
  const m=location.pathname.match(/^\/solution\/(.+)$/);
  if(m) openSol(decodeURIComponent(m[1]),false); else { modal.classList.remove('open'); document.body.style.overflow=''; }
});

let io;
function observe(){
  if(!('IntersectionObserver' in window)){ document.querySelectorAll('.reveal').forEach(e=>e.classList.add('in')); return; }
  io = io || new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} }),{threshold:.08});
  document.querySelectorAll('.reveal:not(.in)').forEach(e=>io.observe(e));
}

render();
const m0=location.pathname.match(/^\/solution\/(.+)$/);
if(m0) openSol(decodeURIComponent(m0[1]),false);
})();
</script>
